# Multiplicador de dano para ataques corpo a corpo em modo JvJ. Mín.: 0,00 Máx.: 500,00 Padrão: 30,00
PVPMeleeDamageModifier=30.0

# Multiplicador de dano para ataques à distância em modo JvJ. Mín.: 0,00 Máx.: 500,00 Padrão: 50,00
PVPFirearmDamageModifier=50.0

# Modifica o alcance da atração dos zombies para os carros. (Os valores mais baixos ajudam nos desfasamentos) Mín.: 0,00 Máx.: 10,00 Padrão: 0,50
CarEngineAttractionModifier=0.5

# Controla se os jogadores chocam com (e derrubam) outros jogadores quando correm na direção deles.
PlayerBumpPlayer=false

# Controla exibição de jogadores remotos no mapa no jogo. 1=Oculto 2=Amigos 3=Todos Mín.: 1 Máx.: 4 Padrão: 1
MapRemotePlayerVisibility=1

# Mín.: 1 Máx.: 300 Padrão: 5
BackupsCount=1

BackupsOnStart=false

BackupsOnVersionChange=false

# Mín.: 0 Máx.: 1500 Padrão: 0
BackupsPeriod=250

# Desativa o rebocar de veículos
DisableVehicleTowing=false

# Desativa o rebocar de caravanas
DisableTrailerTowing=false

# Desativa o rebocar de veículos queimados
DisableBurntTowing=false

# Caminho para o ficheiro com a lista de palavras proibidas. Cada palavra deve estar em uma linha separada
BadWordListFile=

# Caminho para o ficheiro com a lista de palavras permitidas, mesmo que contenham palavras proibidas. Cada palavra deve estar numa linha separada.
GoodWordListFile=

# O que fazer com quem diz palavras proibidas no chat: 1 - banir, 2 - expulsar, 3 - registar a infração na base de dados, 4 - silenciar
BadWordPolicy=3

# O símbolo ou texto que irá substituir a palavra proibida
BadWordReplacement=[HIDDEN]

# Desativa a proteção antibatota: sistema de segurança.
AntiCheatSafety=4

# Desativa a proteção antibatota: velocidade de personagem.
AntiCheatSpeed=4

# Desativa a proteção antibatota contra o "no clipping" (atravessar paredes e objetos).
AntiCheatNoClip=4

# Desativa a proteção antibatota: acerto de personagem.
AntiCheatHit=4

# Desativa a proteção antibatota que verifica exceções de pacotes.
AntiCheatPacketException=4

# Desativa a proteção antibatota: permissões dos jogadores.
AntiCheatPermission=4

# Desativa a proteção antibatota: EXP dos jogadores.
AntiCheatXP=4

# Desativa a proteção antibatota: asilo.
AntiCheatSafeHouse=4

# Desativa a proteção antibatota do jogador.
AntiCheatPlayer=4

# Desativa a proteção antibatota: checksum.
AntiCheatChecksum=4

# Define o período de atualização do modo multijogador em segundos. As estatísticas ficam desativadas se o valor for 0. Mín.: 0 Máx.: 10 Padrão: 1
MultiplayerStatisticsPeriod=1

# Desativa o placar.
DisableScoreboard=false

# Oculta os administradores na lista dos jogadores.
HideAdminsInPlayerList=false

# Define o limite para o processamento de pacotes de rede provenientes de cada cliente no servidor. Mín.: 100 Máx.: 1000 Padrão: 300
MaxPacketsPerSecond=300

# Mostra as coordenadas da personagem do jogador no canto inferior direito.
ShowCoordinates=false

# A semente de geração do mundo usada para gerar o mundo.
# Se quiseres alterar isto, introduz um novo valor e elimina o ficheiro map_worldgen.bin do diretório do teu save.
Seed=

UsePhysicsHitReaction=false

# Mín.: 64 Máx.: 1024 Padrão: 200
ChatMessageCharacterLimit=200

# Mín.: 1 Máx.: 30 Padrão: 3
ChatMessageSlowModeTime=3